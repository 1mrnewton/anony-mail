[package]
name = "anony-mail"
version = "0.4.0"
edition = "2024"
description = "Inbound-only disposable email (temp mail) backend: receives mail over SMTP and serves it via a REST + SSE API."
license = "MIT OR Apache-2.0"
repository = "https://github.com/1mrnewton/anony-mail"
readme = "README.md"
keywords = ["email", "smtp", "tempmail", "disposable-email", "mail-server"]
categories = ["email", "web-programming::http-server"]

[dependencies]
anyhow = "1.0.103"
async-trait = "0.1.89"
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock"] }
dotenvy = "0.15.7"
futures = "0.3.32"
mail-parser = "0.11.4"
rand = "0.10.1"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "derive", "macros", "migrate", "postgres", "sqlite", "runtime-tokio", "tls-rustls-ring", "uuid"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
tower-http = { version = "0.7.0", features = ["cors", "normalize-path", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.4", features = ["v4", "serde"] }
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
governor = "0.10"
fs4 = "1.1.0"
sha2 = "0.11.0"
base64 = "0.23.1"
web-push = { version = "0.11.0", default-features = false, features = ["hyper-client"] }
regex = "1.13.1"
a2 = "0.10.0"
hickory-resolver = "0.26.1"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
# rustls-no-provider: the process installs the `ring` provider explicitly (see
# entitlements.rs) so reqwest itself never pulls a second TLS stack. (appattest
# below does depend on aws-lc-rs for its cert-chain checks, which needs cmake
# at build time — see Dockerfile.)
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# App Attest verification (docs/09), fully local — default `reqwest` feature
# off because we embed Apple's root CA instead of fetching it.
appattest = { version = "0.1.1", default-features = false }
# Only to read the assertion counter out of the CBOR (appattest verifies but
# does not expose it); already in the tree via appattest.
minicbor = "0.25"

[dev-dependencies]
appattest = { version = "0.1.1", default-features = false, features = ["testing"] }
